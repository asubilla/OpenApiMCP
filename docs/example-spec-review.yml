# Example: GitHub Action for reviewing OpenAPI spec changes on a PR.
# Copy this into your API repo's .github/workflows/ directory and adjust paths.
#
# What it does:
#   1. Extracts the base branch's spec to /tmp/base-openapi.json (skips the diff
#      on first-time specs, when the base branch has no spec yet)
#   2. Runs `openapimcp diff <base> <head>`
#   3. Fails the PR check if breaking changes are found (diff exits 1)
name: OpenAPI spec review
on:
  pull_request:
    paths:
      - "openapi.json"

jobs:
  spec-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base spec
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:openapi.json" > /tmp/base-openapi.json 2>/dev/null; then
            echo "has_base=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base=false" >> "$GITHUB_OUTPUT"
            echo "No spec on base branch yet; skipping diff (first-time spec)."
          fi

      - name: Diff base vs head
        if: steps.base.outputs.has_base == 'true'
        uses: asubilla/OpenApiMCP@main
        with:
          spec: /tmp/base-openapi.json
          command: diff
          args: openapi.json
